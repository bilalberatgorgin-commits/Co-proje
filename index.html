<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Okul Projesi</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      background-color: #ffffff;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      position: relative;
    }

    /* Başlat Butonu Stili */
    #startBtn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 15px 40px;
      font-size: 22px;
      font-weight: bold;
      color: #ffffff;
      background-color: #007bff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      transition: background-color 0.2s, transform 0.2s;
      z-index: 10;
    }

    #startBtn:hover {
      background-color: #0056b3;
      transform: translate(-50%, -50%) scale(1.05);
    }

    /* Seken İsim Kutu Stilleri */
    .bouncing-name {
      position: absolute;
      padding: 10px 18px;
      background-color: #ffffff; /* Beyaz arka plan */
      color: #000000;            /* Siyah yazı */
      border: 2px solid #000000; /* Siyah kenarlık */
      border-radius: 20px;
      font-size: 16px;
      font-weight: bold;
      user-select: none;
      white-space: nowrap;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body>

  <button id="startBtn">Başlat 🚀</button>

  <script>
    // İsim listesi
    const isimler = [
      "Efe Memir",
      "Tırcı Berat",
      "Kut Kutlu"
    ];

    const startBtn = document.getElementById("startBtn");
    const elements = [];

    startBtn.addEventListener("click", () => {
      // Butonu gizle
      startBtn.style.display = "none";

      // Her isim için ekranda bir eleman oluştur
      isimler.forEach((isim, index) => {
        const div = document.createElement("div");
        div.className = "bouncing-name";
        div.textContent = isim;
        document.body.appendChild(div);

        const rect = div.getBoundingClientRect();
        
        // Çakışmayı önlemek için birbirinden uzak başlangıç konumları
        let posX = (index + 1) * (window.innerWidth / (isimler.length + 1)) - (rect.width / 2);
        let posY = (index + 1) * (window.innerHeight / (isimler.length + 1)) - (rect.height / 2);

        // Rastgele yön ve hız
        let speedX = (Math.random() > 0.5 ? 1 : -1) * (2.5 + Math.random() * 2);
        let speedY = (Math.random() > 0.5 ? 1 : -1) * (2.5 + Math.random() * 2);

        elements.push({
          element: div,
          x: posX,
          y: posY,
          speedX: speedX,
          speedY: speedY,
          width: rect.width,
          height: rect.height
        });
      });

      // Animasyonu başlat
      requestAnimationFrame(animate);
    });

    // İki kutunun birbiriyle çakışıp çakışmadığını (çarpışıp çarpmadığını) kontrol eden fonksiyon
    function checkCollision(a, b) {
      return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
      );
    }

    // Ana animasyon döngüsü
    function animate() {
      const screenWidth = window.innerWidth;
      const screenHeight = window.innerHeight;

      // Pozisyonları güncelle ve duvar çarpışmalarını kontrol et
      elements.forEach(item => {
        item.x += item.speedX;
        item.y += item.speedY;

        // Duvar çarpışmaları (Sol ve Sağ)
        if (item.x + item.width >= screenWidth) {
          item.x = screenWidth - item.width;
          item.speedX *= -1;
        } else if (item.x <= 0) {
          item.x = 0;
          item.speedX *= -1;
        }

        // Duvar çarpışmaları (Üst ve Alt)
        if (item.y + item.height >= screenHeight) {
          item.y = screenHeight - item.height;
          item.speedY *= -1;
        } else if (item.y <= 0) {
          item.y = 0;
          item.speedY *= -1;
        }
      });

      // İsimlerin birbiriyle çarpışmasını kontrol et
      for (let i = 0; i < elements.length; i++) {
        for (let j = i + 1; j < elements.length; j++) {
          let a = elements[i];
          let b = elements[j];

          if (checkCollision(a, b)) {
            // Hızları değiştir (sektir)
            let tempSpeedX = a.speedX;
            let tempSpeedY = a.speedY;
            
            a.speedX = b.speedX;
            a.speedY = b.speedY;
            
            b.speedX = tempSpeedX;
            b.speedY = tempSpeedY;

            // Kutuların birbirinin içine girmesini önlemek için hafifçe ayır
            a.x += a.speedX;
            a.y += a.speedY;
            b.x += b.speedX;
            b.y += b.speedY;
          }
        }
      }

      // Ekranda yeni konumları uygula
      elements.forEach(item => {
        item.element.style.left = item.x + "px";
        item.element.style.top = item.y + "px";
      });

      requestAnimationFrame(animate);
    }
  </script>
</body>
</html>
