<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Okul Projesi</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      background-color: #ffffff;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      position: relative;
    }

    /* Başla Butonu Stili */
    #startBtn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 15px 40px;
      font-size: 22px;
      font-weight: bold;
      color: #ffffff;
      background-color: #007bff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      transition: background-color 0.2s, transform 0.2s;
      z-index: 10;
    }

    #startBtn:hover {
      background-color: #0056b3;
      transform: translate(-50%, -50%) scale(1.05);
    }

    /* Seken İsim Kutu Stilleri */
    .bouncing-name {
      position: absolute;
      padding: 10px 18px;
      background-color: #333333;
      color: #ffffff;
      border-radius: 20px;
      font-size: 16px;
      font-weight: bold;
      user-select: none;
      white-space: nowrap;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body>

  <button id="startBtn">Başla</button>

  <script>
    // Ekranda sekecek isimlerin listesi (Buraya istediğiniz isimleri ekleyip çıkarabilirsiniz)
    const isimler = [
      "Ali Yılmaz",
      "Ayşe Kaya",
      "Mehmet Demir",
      "Zeynep Çelik",
      "Can Öztürk"
    ];

    // İsim kutuları için renk seçenekleri
    const renkler = ["#e74c3c", "#8e44ad", "#3498db", "#2ecc71", "#f39c12", "#d35400"];

    const startBtn = document.getElementById("startBtn");
    const elements = [];

    startBtn.addEventListener("click", () => {
      // Butonu gizle
      startBtn.style.display = "none";

      // Her isim için ekranda bir eleman oluştur
      isimler.forEach((isim, index) => {
        const div = document.createElement("div");
        div.className = "bouncing-name";
        div.textContent = isim;
        
        // Rastgele arka plan rengi atama
        div.style.backgroundColor = renkler[index % renkler.length];
        document.body.appendChild(div);

        // Rastgele başlangıç pozisyonu ve hız atama
        const rect = div.getBoundingClientRect();
        let posX = Math.random() * (window.innerWidth - rect.width);
        let posY = Math.random() * (window.innerHeight - rect.height);
        
        // Rastgele yön (+ veya - hız)
        let speedX = (Math.random() > 0.5 ? 1 : -1) * (2 + Math.random() * 3);
        let speedY = (Math.random() > 0.5 ? 1 : -1) * (2 + Math.random() * 3);

        elements.push({
          element: div,
          x: posX,
          y: posY,
          speedX: speedX,
          speedY: speedY
        });
      });

      // Animasyonu başlat
      requestAnimationFrame(animate);
    });

    // Sekme hareketini gerçekleştiren fonksiyon
    function animate() {
      const screenWidth = window.innerWidth;
      const screenHeight = window.innerHeight;

      elements.forEach(item => {
        const rect = item.element.getBoundingClientRect();

        item.x += item.speedX;
        item.y += item.speedY;

        // Sağ veya sol kenara çarpma kontrolü
        if (item.x + rect.width >= screenWidth || item.x <= 0) {
          item.speedX *= -1;
        }

        // Alt veya üst kenara çarpma kontrolü
        if (item.y + rect.height >= screenHeight || item.y <= 0) {
          item.speedY *= -1;
        }

        // Pozisyonu güncelle
        item.element.style.left = item.x + "px";
        item.element.style.top = item.y + "px";
      });

      requestAnimationFrame(animate);
    }
  </script>
</body>
</html>
