<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coğrafya - Beşeri ve Doğal Unsur Etkinliği</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      position: relative;
    }

    /* Başlangıç Ekranı */
    #startContainer {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      z-index: 10;
      width: 90%;
      max-width: 360px;
    }

    .credits {
      text-align: center;
      color: #000000;
    }

    .credits h3 {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .credits p {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.4;
      color: #333333;
    }

    .time-select-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 100%;
    }

    .time-select-group label {
      font-size: 14px;
      font-weight: bold;
    }

    .time-select-group select {
      padding: 10px;
      font-size: 15px;
      border: 2px solid #000;
      border-radius: 8px;
      width: 100%;
      outline: none;
      background-color: #fff;
      cursor: pointer;
    }

    #startBtn {
      padding: 14px 40px;
      font-size: 20px;
      font-weight: bold;
      color: #ffffff;
      background-color: #007bff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      width: 100%;
    }

    #startBtn:hover {
      background-color: #0056b3;
    }

    /* Oyun Alanı */
    #gameArea {
      display: none;
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* Üst Bilgi Barı */
    #topBar {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
      z-index: 100;
    }

    .info-badge {
      padding: 8px 20px;
      border: 2px solid #000000;
      border-radius: 20px;
      background-color: #ffffff;
      font-size: 18px;
      font-weight: bold;
      color: #000000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    /* Ekranın Tam Ortasındaki Tek Kart */
    #cardContainer {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      max-width: 380px;
    }

    .box {
      padding: 24px;
      border: 2px solid #000000;
      border-radius: 16px;
      background-color: #ffffff;
      box-shadow: 0 6px 16px rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
      gap: 14px;
      text-align: center;
    }

    .box h2 {
      font-size: 22px;
      color: #000000;
      border-bottom: 2px solid #333;
      padding-bottom: 8px;
    }

    .box p {
      font-size: 14px;
      color: #444;
      line-height: 1.4;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 5px;
    }

    .input-group input {
      padding: 12px;
      border: 1px solid #000000;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      text-align: center;
    }

    .input-group button {
      padding: 12px;
      background-color: #000000;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    /* Bildirim Mesajı */
    #resultMessage {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
      background-color: #fff;
      padding: 8px 16px;
      border: 2px solid #000;
      border-radius: 8px;
      z-index: 100;
    }

    .correct { color: #28a745; }
    .wrong { color: #dc3545; }
    .warning { color: #ff9800; }

    /* Oyun Bitti Penceresi */
    #gameOverModal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      z-index: 200;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background-color: #fff;
      padding: 30px;
      border-radius: 12px;
      border: 3px solid #000;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .modal-content button {
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      background-color: #007bff;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Başlangıç Ekranı -->
  <div id="startContainer">
    <div class="credits">
      <h3>Yapımcılar</h3>
      <p>Emir Özten</p>
      <p>Berat Görgin</p>
    </div>

    <div class="time-select-group">
      <label for="timeSelect">Süre Seçin:</label>
      <select id="timeSelect">
        <option value="10">10 Saniye</option>
        <option value="20">20 Saniye</option>
        <option value="30">30 Saniye</option>
        <option value="60" selected>1 Dakika</option>
        <option value="120">2 Dakika</option>
        <option value="180">3 Dakika</option>
        <option value="240">4 Dakika</option>
        <option value="300">5 Dakika</option>
        <option value="360">6 Dakika</option>
        <option value="420">7 Dakika</option>
        <option value="480">8 Dakika</option>
        <option value="540">9 Dakika</option>
        <option value="600">10 Dakika</option>
      </select>
    </div>

    <button id="startBtn">Başlat 🚀</button>
  </div>

  <!-- Oyun Alanı -->
  <div id="gameArea">
    <div id="topBar">
      <div class="info-badge">Skor: <span id="scoreText">0</span></div>
      <div class="info-badge">Süre: <span id="timerText">00:00</span></div>
    </div>

    <div id="cardContainer"></div>

    <div id="resultMessage"></div>
  </div>

  <!-- Oyun Bitti Penceresi -->
  <div id="gameOverModal">
    <div class="modal-content">
      <h2>Süre Bitti! ⏰</h2>
      <p id="finalScoreText">Toplam Skorunuz: 0</p>
      <button onclick="location.reload()">Yeniden Oyna 🔄</button>
    </div>
  </div>

  <script>
    const beseriList = ["köprü", "yol", "baraj", "bina", "ev", "okul", "hastane", "fabrika", "tünel", "park", "araba", "uçak", "liman", "stadyum", "kanal", "müze", "sokak", "şehir", "kule", "surlar", "tarla", "otel"];
    const dogalList = ["dağ", "nehir", "ırmak", "göl", "deniz", "okyanus", "orman", "ağaç", "toprak", "kaya", "taş", "rüzgar", "bulut", "yağmur", "ova", "plato", "vadi", "şelale", "mağara", "güneş", "hava", "ada", "yanardağ"];

    let score = 0;
    let usedWords = [];
    let wordCounts = {};
    let timerInterval;
    let timeLeft = 0;
    let currentType = "";
    let audioCtx;

    const startContainer = document.getElementById("startContainer");
    const startBtn = document.getElementById("startBtn");
    const gameArea = document.getElementById("gameArea");
    const cardContainer = document.getElementById("cardContainer");
    const resultMessage = document.getElementById("resultMessage");
    const scoreText = document.getElementById("scoreText");
    const timerText = document.getElementById("timerText");
    const timeSelect = document.getElementById("timeSelect");

    // Ses Oluşturma Fonksiyonu
    function playSound(type) {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === "correct") {
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
      } else if (type === "wrong") {
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      }
    }

    startBtn.addEventListener("click", () => {
      score = 0;
      usedWords = [];
      wordCounts = {};
      scoreText.textContent = score;

      timeLeft = parseInt(timeSelect.value);
      updateTimerDisplay();

      startContainer.style.display = "none";
      gameArea.style.display = "block";

      loadNextCard();
      startTimer();
    });

    // Ekranın Ortasına Tek Bir Soru Kartı Yükleme
    function loadNextCard() {
      currentType = Math.random() < 0.5 ? "beseri" : "dogal";

      if (currentType === "beseri") {
        cardContainer.innerHTML = `
          <div class="box">
            <h2>Beşeri Unsur</h2>
            <p>İnsan eliyle ve bir amaç doğrultusunda yapılan bir unsur yazın.</p>
            <div class="input-group">
              <input type="text" id="userInput" placeholder="Cevabınızı yazın..." autofocus>
              <button onclick="checkAnswer()">Kontrol Et</button>
            </div>
          </div>
        `;
      } else {
        cardContainer.innerHTML = `
          <div class="box">
            <h2>Doğal Unsur</h2>
            <p>Doğada kendiliğinden var olan bir unsur yazın.</p>
            <div class="input-group">
              <input type="text" id="userInput" placeholder="Cevabınızı yazın..." autofocus>
              <button onclick="checkAnswer()">Kontrol Et</button>
            </div>
          </div>
        `;
      }

      // Enter tuşuyla gönderme desteği
      document.getElementById("userInput").addEventListener("keypress", (e) => {
        if (e.key === "Enter") checkAnswer();
      });
    }

    function checkAnswer() {
      const inputEl = document.getElementById("userInput");
      const input = inputEl.value.trim().toLowerCase();
      if (!input) return;

      const correctList = currentType === "beseri" ? beseriList : dogalList;

      wordCounts[input] = (wordCounts[input] || 0) + 1;

      if (wordCounts[input] === 3) {
        score -= 1;
        scoreText.textContent = score;
        playSound("wrong");
        showResult("Aynı şeyi 3 kez yazdın! (-1 Puan)", "wrong");
        loadNextCard();
        return;
      }

      if (usedWords.includes(input)) {
        playSound("wrong");
        showResult("Bu kelimeyi zaten kullandın!", "warning");
        inputEl.value = "";
        return;
      }

      if (correctList.includes(input)) {
        score += 1;
        scoreText.textContent = score;
        usedWords.push(input);
        playSound("correct");
        showResult("Doğru! (+1 Puan)", "correct");
        loadNextCard(); // Doğru bilince yeni soruya geç
      } else {
        score -= 1;
        scoreText.textContent = score;
        playSound("wrong");
        showResult("Yanlış! (-1 Puan)", "wrong");
        inputEl.value = "";
      }
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerDisplay();

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          document.getElementById("finalScoreText").textContent = "Toplam Skorunuz: " + score;
          document.getElementById("gameOverModal").style.display = "flex";
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const mins = Math.floor(timeLeft / 60);
      const secs = timeLeft % 60;
      timerText.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function showResult(text, type) {
      resultMessage.textContent = text;
      resultMessage.className = type;
      resultMessage.style.opacity = "1";

      setTimeout(() => {
        resultMessage.style.opacity = "0";
      }, 2000);
    }
  </script>
</body>
</html>
