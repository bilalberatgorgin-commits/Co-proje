<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coğrafya - Beşeri ve Doğal Unsur Etkinliği</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      width: 100vw;
      min-height: 100vh;
      font-family: Arial, sans-serif;
    }

    /* Giriş Butonu */
    #authHeaderBtn {
      position: absolute;
      top: 15px;
      right: 15px;
      padding: 10px 16px;
      background-color: #007bff;
      color: #fff;
      border: none;
      border-radius: 20px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    /* Ana Ekran */
    #startContainer {
      padding-top: 70px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      width: 90%;
      max-width: 360px;
      margin: 0 auto;
    }

    .class-title {
      font-size: 22px;
      font-weight: 900;
      color: #007bff;
      letter-spacing: 1.5px;
      text-align: center;
      text-transform: uppercase;
    }

    .credits {
      text-align: center;
      color: #000;
      width: 100%;
    }

    .credits .credit-block {
      margin-bottom: 8px;
    }

    .credits h4 {
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
      color: #666;
    }

    .credits p {
      font-size: 16px;
      font-weight: bold;
      color: #000;
    }

    .credits .producer-name {
      font-size: 24px !important;
      font-weight: 900 !important;
      color: #000000 !important;
      text-transform: uppercase;
    }

    .time-select-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 100%;
    }

    .time-select-group select {
      padding: 10px;
      font-size: 15px;
      border: 2px solid #000;
      border-radius: 8px;
      width: 100%;
      background-color: #fff;
    }

    #startBtn {
      padding: 14px 40px;
      font-size: 20px;
      font-weight: bold;
      color: #ffffff;
      background-color: #007bff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
    }

    /* Giriş Paneli */
    #authPanel {
      display: none;
      padding-top: 70px;
      width: 90%;
      max-width: 360px;
      margin: 0 auto;
      text-align: center;
    }

    .panel-card {
      background-color: #fff;
      padding: 20px;
      border-radius: 12px;
      border: 2px solid #000;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .panel-card input {
      padding: 12px;
      border: 1px solid #000;
      border-radius: 6px;
      font-size: 14px;
    }

    .panel-card button {
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
      background-color: #007bff;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .list-box {
      max-height: 150px;
      overflow-y: auto;
      text-align: left;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 8px;
      font-size: 13px;
      background-color: #f9f9f9;
    }

    .list-item {
      padding: 6px 0;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .admin-box {
      border-top: 2px dashed #ff9800;
      padding-top: 10px;
      margin-top: 10px;
      text-align: left;
    }

    .admin-box h4 {
      color: #d97706;
      margin-bottom: 6px;
    }

    /* Oyun Alanı */
    #gameArea {
      display: none;
      width: 100%;
      height: 100vh;
      position: relative;
    }

    #topBar {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 15px;
    }

    .info-badge {
      padding: 8px 16px;
      border: 2px solid #000000;
      border-radius: 20px;
      background-color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      color: #000000;
    }

    #cardContainer {
      position: absolute;
      top: 52%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    #resultMessage {
      font-size: 20px;
      font-weight: 800;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
      background-color: #ffffff;
      padding: 10px 24px;
      border: 3px solid #000000;
      border-radius: 30px;
      transform: translateY(10px);
      width: 100%;
    }

    #resultMessage.show {
      opacity: 1;
      transform: translateY(0);
    }

    .correct { color: #28a745; border-color: #28a745 !important; }
    .wrong { color: #dc3545; border-color: #dc3545 !important; }
    .warning { color: #ff9800; border-color: #ff9800 !important; }

    .box {
      width: 100%;
      padding: 24px;
      border: 2px solid #000000;
      border-radius: 16px;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      gap: 14px;
      text-align: center;
    }

    .box h2 {
      font-size: 22px;
      color: #000000;
      border-bottom: 2px solid #333;
      padding-bottom: 8px;
    }

    .box p {
      font-size: 14px;
      color: #444;
      line-height: 1.4;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 5px;
    }

    .input-group input {
      padding: 12px;
      border: 1px solid #000000;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      text-align: center;
    }

    .input-group button {
      padding: 12px;
      background-color: #000000;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <button id="authHeaderBtn" onclick="toggleAuthPanel()">Giriş Yap / Kayıt Ol</button>

  <!-- Başlangıç Ekranı -->
  <div id="startContainer">
    <div class="class-title">10/B BİLİŞİM</div>

    <div class="credits">
      <div class="credit-block">
        <h4>Yapımcı</h4>
        <p class="producer-name">Berat Görgin</p>
      </div>
      <div class="credit-block">
        <h4>Fikir Veren</h4>
        <p>Kutluhan Kuşcu</p>
      </div>
      <div class="credit-block">
        <h4>Yardımcı Olan</h4>
        <p>Emir Özten</p>
      </div>
    </div>

    <div class="time-select-group">
      <label for="timeSelect">Süre Seçin:</label>
      <select id="timeSelect">
        <option value="10">10 Saniye</option>
        <option value="20">20 Saniye</option>
        <option value="30">30 Saniye</option>
        <option value="60" selected>1 Dakika</option>
        <option value="120">2 Dakika</option>
        <option value="180">3 Dakika</option>
        <option value="240">4 Dakika</option>
        <option value="300">5 Dakika</option>
        <option value="360">6 Dakika</option>
        <option value="420">7 Dakika</option>
        <option value="480">8 Dakika</option>
        <option value="540">9 Dakika</option>
        <option value="600">10 Dakika</option>
      </select>
    </div>

    <button id="startBtn">Başlat 🚀</button>
  </div>

  <!-- Giriş Paneli -->
  <div id="authPanel">
    <div class="panel-card">
      <h3 id="authTitle">Giriş Yap / Kayıt Ol</h3>
      <div id="authForm">
        <input type="email" id="userEmail" placeholder="Gmail adresiniz..." style="width:100%;">
        <input type="password" id="userPass" placeholder="Şifreniz..." style="width:100%; margin-top:8px;">
        <button onclick="handleAuth()" style="margin-top:12px; width:100%;">Devam Et ➡️</button>
      </div>
      <div id="userProfile" style="display:none;">
        <p id="loggedInUserText" style="font-weight:bold; word-break:break-all;"></p>
        
        <!-- SADECE SİZİN MAİLİNİZDE GÖRÜNECEK LİSTE -->
        <div id="adminUserListSection" class="admin-box" style="display:none;">
          <h4>🔑 Kayıtlı Kullanıcılar (Gözetim):</h4>
          <div id="allUsersList" class="list-box"></div>
        </div>

        <h4 style="margin-top:10px; text-align:left;">Oyun Geçmişiniz:</h4>
        <div id="historyContainer" class="list-box"></div>
        <button onclick="logout()" style="background-color:#dc3545; margin-top:8px; width:100%;">Çıkış Yap</button>
      </div>
      <button onclick="toggleAuthPanel()" style="background-color:#6c757d; margin-top:5px; width:100%;">Geri Dön ↩️</button>
    </div>
  </div>

  <!-- Oyun Alanı -->
  <div id="gameArea">
    <div id="topBar">
      <div class="info-badge">Skor: <span id="scoreText">0</span></div>
      <div class="info-badge">Süre: <span id="timerText">00:00</span></div>
    </div>

    <div id="cardContainer">
      <div id="resultMessage"></div>
      <div id="cardContent" style="width:100%;"></div>
    </div>
  </div>

  <script>
    const ADMIN_EMAIL = "bilalberatgorgin@gmail.com";

    const beseriList = [
      "köprü", "yol", "baraj", "bina", "ev", "okul", "hastane", "fabrika", "tünel", "park", 
      "araba", "uçak", "liman", "stadyum", "kanal", "müze", "sokak", "şehir", "kule", "surlar", 
      "tarla", "otel", "gökdelen", "avm", "alışveriş merkezi", "geçit", "üstgeçit", "altgeçit", 
      "otoban", "karayolu", "demiryolu", "istasyon", "gar", "havalimanı", "havaalanı", "fırın", 
      "market", "cami", "kilise", "tapınak", "saray", "kale", "anıt", "heykel", "çeşme", 
      "gecekondu", "villa", "apartman", "sera", "maden ocağı", "iskele", "dalgakıran", "sığınak", 
      "kütüphane", "tiyatro", "sinema", "stadyum", "havuz", "lunapark", "uzay üssü", "gözlemevi"
    ];

    const dogalList = [
      "dağ", "nehir", "ırmak", "göl", "deniz", "okyanus", "orman", "ağaç", "toprak", "kaya", 
      "taş", "rüzgar", "bulut", "yağmur", "ova", "plato", "vadi", "şelale", "mağara", "güneş", 
      "hava", "ada", "yanardağ", "peribacası", "traverten", "obruk", "fiyort", "kanyon", 
      "çağlayan", "gayzer", "koy", "körfez", "burun", "yarımada", "akarsu", "dere", "tepe", 
      "buzul", "çöl", "bataklık", "sarmaşık", "çim", "bitki", "volkan", "krater", "krater gölü", 
      "lagün", "falez", "yalıyar", "kumul", "dikit", "sarkıt", "sütun", "düden", "polye", "dolin"
    ];

    let score = 0;
    let usedWords = [];
    let wordCounts = {};
    let timerInterval;
    let timeLeft = 0;
    let currentType = "";
    let audioCtx = null;
    let currentUser = localStorage.getItem("currentUser") || null;

    const startContainer = document.getElementById("startContainer");
    const authPanel = document.getElementById("authPanel");
    const startBtn = document.getElementById("startBtn");
    const gameArea = document.getElementById("gameArea");
    const cardContent = document.getElementById("cardContent");
    const resultMessage = document.getElementById("resultMessage");
    const scoreText = document.getElementById("scoreText");
    const timerText = document.getElementById("timerText");
    const timeSelect = document.getElementById("timeSelect");
    const authHeaderBtn = document.getElementById("authHeaderBtn");

    updateAuthUI();

    function toggleAuthPanel() {
      if (authPanel.style.display === "block") {
        authPanel.style.display = "none";
        startContainer.style.display = "flex";
      } else {
        authPanel.style.display = "block";
        startContainer.style.display = "none";
        updateAuthUI();
      }
    }

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSound(type) {
      initAudio();
      if (!audioCtx) return;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === "correct") {
        osc.type = "sine";
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
      } else if (type === "wrong") {
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(180, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(90, audioCtx.currentTime + 0.25);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
      }
    }

    function handleAuth() {
      const email = document.getElementById("userEmail").value.trim().toLowerCase();
      const pass = document.getElementById("userPass").value.trim();

      if (!email || !pass) {
        alert("Lütfen Gmail ve şifrenizi girin!");
        return;
      }

      const users = JSON.parse(localStorage.getItem("registeredUsers") || "{}");
      users[email] = pass;
      localStorage.setItem("registeredUsers", JSON.stringify(users));

      currentUser = email;
      localStorage.setItem("currentUser", currentUser);
      updateAuthUI();
    }

    function logout() {
      currentUser = null;
      localStorage.removeItem("currentUser");
      updateAuthUI();
    }

    function updateAuthUI() {
      if (currentUser) {
        authHeaderBtn.textContent = "👤 Hesabım";
        document.getElementById("authTitle").textContent = "Hesap Paneli";
        document.getElementById("authForm").style.display = "none";
        document.getElementById("userProfile").style.display = "block";
        document.getElementById("loggedInUserText").textContent = currentUser;
        renderHistory();

        const adminSection = document.getElementById("adminUserListSection");
        if (currentUser === ADMIN_EMAIL) {
          adminSection.style.display = "block";
          renderAllUsers();
        } else {
          adminSection.style.display = "none";
        }

      } else {
        authHeaderBtn.textContent = "Giriş Yap / Kayıt Ol";
        document.getElementById("authTitle").textContent = "Giriş Yap / Kayıt Ol";
        document.getElementById("authForm").style.display = "block";
        document.getElementById("userProfile").style.display = "none";
      }
    }

    function renderAllUsers() {
      const users = JSON.parse(localStorage.getItem("registeredUsers") || "{}");
      const container = document.getElementById("allUsersList");
      const keys = Object.keys(users);

      if (keys.length === 0) {
        container.innerHTML = "<p style='color:#777;'>Henüz kayıtlı kullanıcı yok.</p>";
        return;
      }

      container.innerHTML = keys.map(email => `
        <div class="list-item">
          <span>📧 ${email}</span>
          <span>🔑 <strong>${users[email]}</strong></span>
        </div>
      `).join("");
    }

    function saveGameToHistory(finalScore) {
      if (!currentUser) return;

      const historyKey = "history_" + currentUser;
      const history = JSON.parse(localStorage.getItem(historyKey) || "[]");
      
      const now = new Date();
      const dateStr = now.toLocaleDateString("tr-TR");
      const timeStr = now.toLocaleTimeString("tr-TR", { hour: '2-digit', minute: '2-digit' });

      history.unshift({ score: finalScore, date: `${dateStr} - ${timeStr}` });
      localStorage.setItem(historyKey, JSON.stringify(history));
    }

    function renderHistory() {
      if (!currentUser) return;
      const historyKey = "history_" + currentUser;
      const history = JSON.parse(localStorage.getItem(historyKey) || "[]");
      const container = document.getElementById("historyContainer");

      if (history.length === 0) {
        container.innerHTML = "<p style='color:#777;'>Henüz kayıtlı oyun yok.</p>";
        return;
      }

      container.innerHTML = history.map(item => `
        <div class="list-item">
          <span>📅 ${item.date}</span>
          <strong>Skor: ${item.score}</strong>
        </div>
      `).join("");
    }

    startBtn.addEventListener("click", () => {
      initAudio();
      score = 0;
      usedWords = [];
      wordCounts = {};
      scoreText.textContent = score;

      timeLeft = parseInt(timeSelect.value);
      updateTimerDisplay();

      startContainer.style.display = "none";
      authPanel.style.display = "none";
      authHeaderBtn.style.display = "none";
      gameArea.style.display = "block";

      loadNextCard();
      startTimer();
    });

    function loadNextCard() {
      currentType = Math.random() < 0.5 ? "beseri" : "dogal";

      if (currentType === "beseri") {
        cardContent.innerHTML = `
          <div class="box">
            <h2>Beşeri Unsur</h2>
            <p>İnsan eliyle ve bir amaç doğrultusunda yapılan bir unsur yazın.</p>
            <div class="input-group">
              <input type="text" id="userInput" placeholder="Cevabınızı yazın..." autocomplete="off">
              <button onclick="checkAnswer()">Kontrol Et</button>
            </div>
          </div>
        `;
      } else {
        cardContent.innerHTML = `
          <div class="box">
            <h2>Doğal Unsur</h2>
            <p>Doğada kendiliğinden var olan bir unsur yazın.</p>
            <div class="input-group">
              <input type="text" id="userInput" placeholder="Cevabınızı yazın..." autocomplete="off">
              <button onclick="checkAnswer()">Kontrol Et</button>
            </div>
          </div>
        `;
      }

      const inputEl = document.getElementById("userInput");
      inputEl.focus();
      inputEl.addEventListener("keypress", (e) => {
        if (e.key === "Enter") checkAnswer();
      });
    }

    function checkAnswer() {
      const inputEl = document.getElementById("userInput");
      const input = inputEl.value.trim().toLowerCase();
      if (!input) return;

      const correctList = currentType === "beseri" ? beseriList : dogalList;

      wordCounts[input] = (wordCounts[input] || 0) + 1;

      if (wordCounts[input] === 3) {
        score -= 1;
        scoreText.textContent = score;
        playSound("wrong");
        showResult("Aynı şeyi 3 kez yazdın! (-1 Puan)", "wrong");
        loadNextCard();
        return;
      }

      if (usedWords.includes(input)) {
        playSound("wrong");
        showResult("Bu kelimeyi zaten kullandın!", "warning");
        inputEl.value = "";
        return;
      }

      if (correctList.includes(input)) {
        score += 1;
        scoreText.textContent = score;
        usedWords.push(input);
        playSound("correct");
        showResult("Doğru! (+1 Puan)", "correct");
        loadNextCard();
      } else {
        score -= 1;
        scoreText.textContent = score;
        playSound("wrong");
        showResult("Yanlış! (-1 Puan)", "wrong");
        inputEl.value = "";
      }
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerDisplay();

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          saveGameToHistory(score);
          alert("Süre Bitti! Toplam Skorunuz: " + score);
          location.reload();
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const mins = Math.floor(timeLeft / 60);
      const secs = timeLeft % 60;
      timerText.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    let msgTimeout;
    function showResult(text, type) {
      clearTimeout(msgTimeout);
      resultMessage.textContent = text;
      resultMessage.className = `
