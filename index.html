  <script>

    // E-postaları Firebase anahtarlarında nokta (.) kullanılmadığı için dönüştürme yardımcıları
    function emailToKey(email) {
      return email.trim().toLowerCase().replace(/\./g, "_");

      "köprü", "yol", "baraj", "bina", "ev", "okul", "hastane", "fabrika", "tünel", "park",

      "otoban", "karayolu", "demiryolu", "istasyon", "gar", "havalimanı", "havaalanı", "fırın",

      "hava", "ada", "yanardağ", "peribacası", "traverten", "obruk", "fiyort", "kanyon", 
      "çağlayan", "gayzer", "koy", "körfez", "burun", "yarımada", "akarsu", "dere", "tepe", 
      "buzul", "çöl", "bataklık", "sarmaşık", "çim", "bitki", "volkan", "krater", "krater gölü", 
      "lagün", "falez", "yalıyar", "kumul", "dikit", "sarkıt", "sütun", "düden", "polye", "dolin"

    // Başlangıçta Admin hesabını buluta otomatik kaydet
    db.ref("users/" + emailToKey(ADMIN_EMAIL)).once("value", snapshot => {
      if (!snapshot.exists()) {
        db.ref("users/" + emailToKey(ADMIN_EMAIL)).set({
          password: ADMIN_PASS,
          createdAt: Date.now()

    });

    updateAuthUI();

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSound(type) {
      initAudio();
      if (!audioCtx) return;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === "correct") {
        osc.type = "sine";
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
      } else if (type === "wrong") {
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(180, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(90, audioCtx.currentTime + 0.25);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
      }
    }

    /* Üyelik ve Tab Yönetimi */
    function switchTab(tab) {
      if (tab === 'login') {
        document.getElementById("loginTabBtn").classList.add("active");
        document.getElementById("registerTabBtn").classList.remove("active");
        document.getElementById("loginForm").style.display = "block";
        document.getElementById("registerForm").style.display = "none";
      } else {
        document.getElementById("registerTabBtn").classList.add("active");
        document.getElementById("loginTabBtn").classList.remove("active");
        document.getElementById("registerForm").style.display = "block";
        document.getElementById("loginForm").style.display = "none";
      }
    }

    function openAuthModal() {
      document.getElementById("authModal").style.display = "flex";
      updateAuthUI();
    }

    function closeAuthModal() {
      document.getElementById("authModal").style.display = "none";
    }

    function openAdminModal() {
      if (currentUser !== ADMIN_EMAIL) return;
      document.getElementById("adminModal").style.display = "flex";
      renderAdminUsers();

    function closeAdminModal() {
      document.getElementById("adminModal").style.display = "none";

    // Buluttan Giriş Yapma
    function handleLogin() {
      const emailInput = document.getElementById("loginEmail").value.trim().toLowerCase();
      const pass = document.getElementById("loginPass").value.trim();

      if (!emailInput || !pass) {
        alert("Lütfen Gmail ve şifrenizi girin!");
        return;
      }

      const userKey = emailToKey(emailInput);

      db.ref("users/" + userKey).once("value", snapshot => {
        if (!snapshot.exists()) {
          alert("Bu e-posta ile kayıtlı hesap bulunamadı! Lütfen 'Kayıt Ol' sekmesinden hesap oluşturun.");
        } else {
          const data = snapshot.val();
          if (data.password === pass) {
            currentUser = emailInput;
            localStorage.setItem("currentUser", currentUser);
            updateAuthUI();
            alert("Başarıyla giriş yapıldı!");
            closeAuthModal();
          } else {
            alert("Hatalı şifre girdiniz! Lütfen kontrol edip tekrar deneyin.");
          }
        }
      });
    }

    // Buluta Kayıt Olma
    function handleRegister() {
      const emailInput = document.getElementById("regEmail").value.trim().toLowerCase();
      const pass = document.getElementById("regPass").value.trim();
      const passConfirm = document.getElementById("regPassConfirm").value.trim();

      if (!emailInput || !pass || !passConfirm) {
        alert("Lütfen tüm alanları doldurun!");
        return;
      }

      if (pass !== passConfirm) {
        alert("Şifreler birbiriyle eşleşmiyor! Lütfen şifreleri aynı yazın.");
        return;
      }

      const userKey = emailToKey(emailInput);

      db.ref("users/" + userKey).once("value", snapshot => {
        if (snapshot.exists()) {
          alert("Bu e-posta adresi zaten kayıtlı! Lütfen 'Giriş Yap' sekmesini kullanın.");
        } else {
          db.ref("users/" + userKey).set({
            password: pass,
            createdAt: Date.now()
          }).then(() => {
            alert("Hesabınız başarıyla oluşturuldu ve giriş yapıldı!");
            currentUser = emailInput;
            localStorage.setItem("currentUser", currentUser);
            updateAuthUI();
            closeAuthModal();
          });
        }
      });
    }

    function logout() {
      currentUser = null;
      localStorage.removeItem("currentUser");
      updateAuthUI();
      closeAuthModal();
    }

        document.getElementById("authFormSection").style.display = "block";
        document.getElementById("userProfile").style.display = "none";
      }
    }

    /* Admin İşlevleri (Buluttan Kullanıcı Çekme) */
    function renderAdminUsers() {
      const container = document.getElementById("adminUserList");
      db.ref("users").on("value", snapshot => {
        const users = snapshot.val() || {};
        const keys = Object.keys(users);

        if (keys.length === 0) {
          container.innerHTML = "<p style='color:#777;'>Kayıtlı kullanıcı yok.</p>";
          return;
        }

        container.innerHTML = keys.map(e => `
          <div class="history-item">
            <span>📧 ${keyToEmail(e)}</span>
            <strong>🔑 ${users[e].password}</strong>
          </div>
        `).join("");
      });
    }

    function addCustomTime() {
      const mins = parseInt(document.getElementById("customMinInput").value);
      if (!mins || mins <= 0) return alert("Geçerli bir dakika girin!");

      const secs = mins * 60;
      const opt = document.createElement("option");
      opt.value = secs;
      opt.textContent = `${mins} Dakika (Özel)`;
      timeSelect.appendChild(opt);
      opt.selected = true;

      alert(`${mins} dakikalık yeni süre eklendi!`);
      document.getElementById("customMinInput").value = "";
    }

    function addNewWord() {
      const cat = document.getElementById("newWordCat").value;
      const word = document.getElementById("newWordTxt").value.trim().toLowerCase();

      if (!word) return alert("Bir kelime girin!");

      if (cat === "beseri") {
        beseriList.push(word);
        localStorage.setItem("customBeseri", JSON.stringify(beseriList));
      } else {
        dogalList.push(word);
        localStorage.setItem("customDogal", JSON.stringify(dogalList));
      }

      alert(`'${word}' kelimesi eklendi!`);
      document.getElementById("newWordTxt").value = "";
    }

    // Buluta Skor Kaydetme
    function saveGameToHistory(finalScore) {
      if (!currentUser) return;
      const userKey = emailToKey(currentUser);
      
      const now = new Date();
      const dateStr = now.toLocaleDateString("tr-TR");
      const timeStr = now.toLocaleTimeString("tr-TR", { hour: '2-digit', minute: '2-digit' });

      db.ref("scores/" + userKey).push({
        score: finalScore,
        date: `${dateStr} - ${timeStr}`
      });
    }

    // Buluttan Skor Geçmişini Çekme
    function renderHistory() {
      if (!currentUser) return;
      const userKey = emailToKey(currentUser);
      const container = document.getElementById("historyContainer");

      db.ref("scores/" + userKey).on("value", snapshot => {
        const scoresObj = snapshot.val() || {};
        const items = Object.values(scoresObj).reverse(); // En son oynanan en üstte

        if (items.length === 0) {
          container.innerHTML = "<p style='color:#777;'>Henüz kayıtlı oyun yok.</p>";
          return;
        }

        container.innerHTML = items.map(item => `
          <div class="history-item">
            <span>📅 ${item.date}</span>
            <strong>Skor: ${item.score}</strong>
          </div>
        `).join("");
      });
    }

    startBtn.addEventListener("click", () => {
      initAudio();
      score = 0;
      usedWords = [];
      wordCounts = {};
      scoreText.textContent = score;

      timeLeft = parseInt(timeSelect.value);
      updateTimerDisplay();

      startContainer.style.display = "none";
      document.getElementById("headerButtons").style.display = "none";
      gameArea.style.display = "block";

      loadNextCard();
      startTimer();
    });

    function loadNextCard() {
      currentType = Math.random() < 0.5 ? "beseri" : "dogal";

      if (currentType === "beseri") {
        cardContent.innerHTML = `
          <div class="box">
            <h2>Beşeri Unsur</h2>
            <p>İnsan eliyle ve bir amaç doğrultusunda yapılan bir unsur yazın.</p>
            <div class="input-group">
              <input type="text" id="userInput" placeholder="Cevabınızı yazın..." autocomplete="off">
              <button onclick="checkAnswer()">Kontrol Et</button>
            </div>
          </div>
        `;
      } else {
        cardContent.innerHTML = `
          <div class="box">
            <h2>Doğal Unsur</h2>
            <p>Doğada kendiliğinden var olan bir unsur yazın.</p>
            <div class="input-group">
              <input type="text" id="userInput" placeholder="Cevabınızı yazın..." autocomplete="off">
              <button onclick="checkAnswer()">Kontrol Et</button>
            </div>
          </div>
        `;
      }

      const inputEl = document.getElementById("userInput");
      inputEl.focus();
      inputEl.addEventListener("keypress", (e) => {
        if (e.key === "Enter") checkAnswer();
      });
    }

    function checkAnswer() {
      const inputEl = document.getElementById("userInput");
      const input = inputEl.value.trim().toLowerCase();
      if (!input) return;

      const correctList = currentType === "beseri" ? beseriList : dogalList;

      wordCounts[input] = (wordCounts[input] || 0) + 1;

      if (wordCounts[input] === 3) {
        score -= 1;
        scoreText.textContent = score;
        playSound("wrong");
        showResult("Aynı şeyi 3 kez yazdın! (-1 Puan)", "wrong");
        loadNextCard();
        return;
      }

      if (usedWords.includes(input)) {
        playSound("wrong");
        showResult("Bu kelimeyi zaten kullandın!", "warning");
        inputEl.value = "";
        return;
      }

      if (correctList.includes(input)) {
        score += 1;
        scoreText.textContent = score;
        usedWords.push(input);
        playSound("correct");
        showResult("Doğru! (+1 Puan)", "correct");
        loadNextCard();
      } else {
        score -= 1;
        scoreText.textContent = score;
        playSound("wrong");
        showResult("Yanlış! (-1 Puan)", "wrong");
        inputEl.value = "";
      }
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerDisplay();

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          saveGameToHistory(score);
          document.getElementById("finalScoreText").textContent = "Toplam Skorunuz: " + score;
          document.getElementById("gameOverModal").style.display = "flex";
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const mins = Math.floor(timeLeft / 60);
      const secs = timeLeft % 60;
      timerText.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    let msgTimeout;
    function showResult(text, type) {
      clearTimeout(msgTimeout);
      resultMessage.textContent = text;
      resultMessage.className = `show ${type}`;

      msgTimeout = setTimeout(() => {
        resultMessage.className = "";
      }, 1500);
    }
  </script>
</body>
</html>
